<nav class="site-nav" aria-label="Primary navigation">

  <!-- Visible on mobile and desktop -->
  <a
    class="site-nav-button Caption NoLine"
    href="{{ site.reservations_link }}"
    target="_blank"
    rel="noopener"
  >
    Reserve
  </a>

  <a
    href="/"
    class="Logo site-nav-logo Caption NoLine"
    aria-label="Canlis Home"
  >
    Canlis
  </a>

  <!-- Desktop navigation -->
  <div class="site-nav-links site-nav-desktop">

    <details class="site-nav-explore">
      <summary class="site-nav-trigger Caption">
        <span>Explore</span>
        <span class="site-nav-caret" aria-hidden="true"></span>
      </summary>

      <div class="site-nav-dropdown">
        <ul>
          {% for item in site.global_nav %}
            <li>
              <a
                class="Caption NoLine"
                href="{{ item.slug }}"
                {% if item.slug contains '://' %}
                  target="_blank"
                  rel="noopener"
                {% endif %}
              >
                {{ item.title }}
              </a>
            </li>
          {% endfor %}
        </ul>
      </div>
    </details>

  </div>

  <!-- Mobile navigation -->
  <div class="site-nav-mobile">

    <details class="site-nav-explore">
      <summary class="site-nav-trigger Caption">
        <span>Explore</span>
        <span class="site-nav-caret" aria-hidden="true"></span>
      </summary>

      <div class="site-nav-dropdown site-nav-dropdown-mobile">
        <ul>
          {% for item in site.global_nav %}
            <li>
              <a
                class="Caption NoLine"
                href="{{ item.slug }}"
                {% if item.slug contains '://' %}
                  target="_blank"
                  rel="noopener"
                {% endif %}
              >
                {{ item.title }}
              </a>
            </li>
          {% endfor %}
        </ul>
      </div>
    </details>

  </div>

</nav>
